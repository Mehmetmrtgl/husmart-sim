# Beytepe map / simulation editing tool settings.
# Paths are relative to the repo root (husmart-sim) unless they start with ~ or /.

yollar:
  temel_harita: harita/beytepe_yeni_v2/temel/lanelet2_map.osm   # original lanelet map before the gate edit (input)
  harita: harita/beytepe_yeni_v2/lanelet2_map.osm                # generated lanelet map (output)
  temel_bulut: harita/beytepe_yeni_v2/temel/pointcloud_map.pcd   # original point cloud (input, from Release v0.1)
  bulut: harita/beytepe_yeni_v2/pointcloud_map.pcd               # generated point cloud (output)
  karolar: harita/beytepe_yeni_v2_karolar                        # generated 50 m tiles (output)
  cizim_kml: tools/beytepe_duzenle/veri/nizamiye_cizim.kml       # Google Earth drawing of the gate (input)
  ara: tools/beytepe_duzenle/uretilen                           # intermediate files (generated, not in git)
  refuj_nesneler: tools/beytepe_duzenle/veri/refuj_nesneler.json  # median lamps + trees (output of "refuj-tespit", input of "awsim")
  refuj_guney_nesneler: tools/beytepe_duzenle/veri/refuj_guney_nesneler.json  # south median lamps + trees (output of "refuj-guney-tespit")
  nizamiye_nesneler: tools/beytepe_duzenle/veri/nizamiye_nesneler.json  # gate barriers, flags, wall, fence ... (measured by hand, input of "awsim")
  yol_kenari_nesneler: tools/beytepe_duzenle/veri/yol_kenari_nesneler.json  # trees along the tour route (output of "kenar-tespit", input of "awsim")
  roadrunner_fbx: ~/awsim/AWSIM-src/Assets/Beytepe/Model/Beytepe.fbx   # RoadRunner world model (input of the road-surface repair)
  korkuluklar: tools/beytepe_duzenle/veri/korkuluklar.json         # guardrails + concrete parapets along the tour route (ends measured by hand, input of "awsim")
  awsim_veri: ~/awsim/AWSIM-src/Assets/Beytepe/Data/duzenlemeler.json   # AWSIM scene data (output)
  awsim_bulut: ~/awsim/beytepe_nizamiye_bulut.bin                # point cloud written by the AWSIM build (input of "bulut")
  sim_kml: docs/ust_bakis/beytepe_sim.kml                        # simulation lanes for Google Earth (output of "kml")
  yedek: ~/yedek/beytepe_duzenle                                 # every overwritten file is copied here first
  # real-vehicle data (only for "refuj-tespit" and "kontrol"; not in the repo)
  gercek_lidar: ~/autoware_map/beytepe_gercek_v1/pointcloud_map.pcd
  gercek_poz: ~/harita_gercek/poz_v4.npz
  zed_video: ~/harita_gercek/zed/sol_sag.hevc
  zed_zaman: ~/harita_gercek/zed/zaman_ns.npy
  zed_konteyner: autoware_harita        # docker container with ffmpeg; ~/harita_gercek is mounted as /is
  zed_konteyner_video: /is/zed/sol_sag.hevc   # the same video as seen inside that container

cizim:
  # Google Earth imagery is offset from the map frame; measured with real lidar walls and existing lanes.
  goruntu_kaymasi_m: [0.9, 1.25]        # added to the drawing: +x (east), +y (north)
  # names of the placemarks in the KML
  rota:
    cikis_sol: "sol çıkış araç gidiş"
    cikis_sag: "sağ çıkış araç rota"
    cikis_cep: "çıkış cep araç rota"
    giris_sol: "giriş sol araç rota"
    giris_sag: "giriş sağ araç rota"
    giris_cep: "giriş sağ cep araç rota"
    donus: "çıkıştan girişe u dönüşü araç rota"
  asfalt: ["çıkış sol güvenlik", "çıkış sağ cep", "çıkış sağ şerit", "nizamiye dönüş", "ring dönüş",
           "giriş sağ şerit", "giriş sağ cep", "çıkış sol şerit", "giriş sol şerit"]
  ada: ["kaldırım ve peyzaj"]
  durak: "durak yeri"
  kulube: ["büyük güvenlik", "küçük güvenlik"]   # guard booths: the island under a booth is fully paved

nizamiye:
  serit_genislik: 3.5
  kuzey_baglanti_y: 2618.3      # new lanes start at the end of the existing northbound lanes (speed bump stays)
  guney_baglanti_y: 2550.0      # new entry lanes join the existing southbound lanes here
  kuzey_uc_y: 2760.0            # north end of the new exit / entry lanes (map edge)
  sag_catal_y: 2654.25          # right exit lane forks into exit / exit pocket
  cep_catal_y: 2733.85          # right entry lane forks into the bus-stop bay
  cep_birlesme_y: 2562.65       # bus-stop bay merges back
  cep_giris_uzatma_m: 15.0      # bay entry curve is extended this far past the drawn corner
  hiz_siniri: 64
  not: "nizamiye 2026-11-13 (kullanıcı çizimi v2)"   # prefix of the "note" tag of the new lanes
  # the drawn U-turn route lies up to ~2 m north of where the real car turned (tour 26: the car grazed the big booth's
  # island and the median tip reached into the real path): its centre follows the real drive path, blended back onto
  # the drawn route over this length at both ends (0: drawn route only)
  donus_gercek_iz_gecis_m: 8.0
  # U-turn fork (exit side) / merge (entry side) y: the real car started and finished turning ~5 m south of the drawn
  # route's ends. With these set the U-turn lane starts / ends here and its centre IS the real drive path (ends moved
  # onto the lane centres over donus_gercek_iz_gecis_m). Tour 28: the drawn-route spline forced straight ends and
  # squeezed the turn to R 3-4.5 m (car 0.57 m off centre, inner border folded back). Remove to use the drawn route.
  donus_gercek_iz_y: [2658.0, 2657.0]
  # RoadRunner gives every junction lanelet its own virtual borders: parallel straight lanes through a junction do not
  # share their border, so Autoware does not see them as neighbours and the route forces a lane change before every
  # such junction (tour 26: y 888 / 1252 / 1622, campus y -266). Coincident borders (same end nodes) become shared.
  kavsak_komsu_tolerans_m: 0.15   # 0: off
  # Junctions on the tour where vehicles on the listed lanes really give way to the tour route or never cross it
  # (confirmed by the user 2026-11-25). The map has no right_of_way rules, so Autoware's intersection module yielded to
  # every conflicting lane (tour 28: long waits, a 3.45 m/s2 brake for a car going straight in the next lane).
  # rota: the tour's junction lanelet; yol_ver: lanes that yield to it. Base-map lanelet ids.
  oncelik:
    - {ad: "K2 (-68, 197)", rota: [2000190], yol_ver: [2000101]}
    # Return leg southbound: the tour goes straight on 2000211; traffic from the east (2000131 curve, 2000238) merges
    # into the same lane and gives way (tour 29: a 74 s wait at the stop line here).
    - {ad: "Merge (-205, 232)", rota: [2000211], yol_ver: [2000131, 2000238]}
  # Lower speed limits (km/h) on listed lanelets. K3 approach (2026-11-26): crossing traffic from the south joins here and the
  # real priority is unknown, so the car comes in slowly enough to stop gently (tour 32: 4.45 m/s2 from 24 km/h).
  hiz_sinirlari:
    - {ad: "K3 approach (-136, 224)", lanelet: [2000005, 2000239, 2000293], km_sa: 20}
  # existing map elements the new lanes connect to (ids in the base map)
  kuzey_baslangic_dugumleri: ["3722", "1014", "604"]   # north ends of the existing northbound borders (left, middle, right)
  guney_yollari: ["2000350", "2000316", "2000317"]     # existing southbound borders (left, middle, right), cut at guney_baglanti_y
  kirpilacak_yollar: ["1000222", "1000032", "1000423"] # old borders that lose their nodes north of the junction
  awsim:
    izgara: [-200.0, -110.0, 2530.0, 2770.0, 0.5]   # x0 x1 y0 y1 resolution of the terrain-regrade grid
    sev_m: 8.0                  # cut / fill slope width around the new road
    bosluk_doldur_m: 1.3        # gaps between lanes narrower than 2x this become asphalt
    eski_seritler: ["2000205", "2000115"]   # base-map southbound lanes whose northern part was removed (becomes grass)
    mevcut_yol_kenar_m: 1.0     # existing lanes + this margin (gutter, curb) keep their RoadRunner shape (no regrade)
    ada_tumsek: 0.10            # grass mound of those islands
    ada_kose_yaricap_m: 1.5     # island curb corners are rounded with this radius
    ada_dolgu_m: 15.0           # undrawn open areas up to 2x this wide next to an island become asphalt (no bare ground at road level)
    eski_yol_cim_m: 6.0         # old RoadRunner road pieces within this distance of the new asphalt turn into grass ...
    mevcut_yol_koruma_m: 2.0    # ... except within this distance of the existing lanes (their shoulders stay)
    baglanti_rampa_m: 6.0       # where the new lanes join the existing ones, the new asphalt starts lower and rises over this length
    baglanti_alcalma_m: 0.06    # ... starting this much lower than its normal height (+2 cm), i.e. just under the old road

refuj:
  kaldirim_genislik: 1.75
  kaldirim_yukseklik: 0.18
  tumsek: 0.25                  # grass mound height in the middle
  lamba_boy: 9.5
  lamba_kol: 2.6
  lamba_aralik: 45.3            # typical spacing of the median lamps
  sabit_lamba_y: [2581.2]       # lamps confirmed in lidar + camera (anchors)
  kamera_lamba_y: [2628.0, 2658.0]   # lamps found only in the camera frames
  kenar_payi_m: 0.3             # the curb stands this far inside the lane edge (the yellow edge line stays visible); asphalt in between
  bulut_kenar_m: 14.0           # point-cloud update region = median + this margin (covers both carriageways)
  # lanes along the median (ids in the generated map; the new gate lanes are added from nizamiye_plan.json)
  # the median runs from the campus junction (y ~300) to the gate U-turn as ONE island (2026-11-23: it used to start at y 1700)
  dogu_seritler: ["2000248", "2000284", "2000256", "2000188", "2000224", "2000092", "2000104", "2000132"]   # northbound lanes, south -> north (then new A1, A2)
  bati_serit: "2000205"                   # existing southbound lane south of the new entry lanes (after new G1c, G1d)
  bati_seritler_ek: ["2000130", "2000138", "2000128", "2000253"]   # ... continued southwards to the junction
  eksen_baslangic_y: 300.0                # the median axis starts north of this y
  yaya_gecidi_boslugu_m: 0.5              # the median is cut where a crosswalk crosses it (crosswalk + this margin)
  # south of the nose the carriageways part: the median goes on as a widening wedge down to the campus junction ring
  # (real curbs on both sides in the ZED frames; user 2026-11-26). Wedge = lane-free area in the box holding the seed point;
  # its trees are the measured roadside ones (veri/yol_kenari_nesneler.json). Remove the block to end the median at y ~300 again.
  guney_kama:
    kutu: [-225.0, -140.0, 225.0, 310.0]  # x0 x1 y0 y1 (y1 must reach past the old nose, where the median is a straight strip)
    tohum: [-178.0, 268.0]                # a point inside the wedge
    # cut lines x1 y1 x2 y2 (the seed side stays): the lane-free gore between the K3 junction lanes 2000277 / 2000293 is
    # road; the real island nose (keep-right sign) is where lane 2000149 starts
    kes: [[-156.0, 247.1, -158.0, 245.3]]
  guney:                                # lamp/tree detection for the south part of the median (refuj-guney-tespit); the island itself is the one above
    dogu_seritler: ["2000248", "2000284", "2000256", "2000188", "2000224", "2000092", "2000104"]   # northbound lanes, south -> north (inner border = left)
    bati_seritler: ["2000138", "2000128", "2000253"]                        # southbound lanes, north -> south (inner border = left)
    y_bas: 300.0                          # detection starts north of this y (junction at the south end)
    y_son: 1705.0                         # ... and ends here, where the north detection (refuj_nesneler, trees from y 1708) takes over
    lamba_aralik: 45.3                    # assumed spacing of the median lamps where the lidar shows none (gaps filled only between lidar lamps)

yol_kenari:                     # trees along the tour route (kenar-tespit; real lidar map around the real drive = tour route)
  koridor_m: 22.0               # corridor half-width around the drive: RoadRunner eucalyptus trees inside are replaced by measured ones
  parca_m: 150.0                # the corridor is cut into pieces of this length (no holes; point-cloud regions)
  govde_h: [0.7, 2.3]           # trunk slice above the ground
  tac_min_m: 3.0                # tree top at least this high ...
  yayilim_min_m: 1.2            # ... and its crown at least this wide (90th percentile radius): poles, signs and cars have none
  boy_max_m: 20.0               # taller tops are clipped (lidar ghosts above a crown)
  yol_payi_m: 0.5               # a trunk stays this far from every lane
  ada_payi_m: 0.5               # ... and from the median / gate islands (they have their own trees)
  # every crown (roadside and median trees / bushes) stays this far from the lanes; the scene's crowns reach down to the
  # ground, so an overhanging crown is an obstacle at roof height (tour 29: emergency brake at y 1957)
  tac_yol_payi_m: 0.4
  tac_en_az_m: 0.4              # a plant whose crown would get narrower than this is left out

cizgiler:                       # lane marking colours on the tour roads, as in the real ZED frames (2026-11-23); RoadRunner has them the other way round
  # rules: lane divider (same direction) and the centre line of a two-way road -> white; road edge (also the median side) -> yellow
  rota_m: 10.0                  # recoloured: lanelets with >= rota_oran of their centre line within this distance of the real drive (= tour route)
  rota_oran: 0.6
  sari_orta_kutu: [-235.0, -195.0, -270.0, 240.0]   # x0 x1 y0 y1: west campus road, the line between the two directions is yellow (bollards on it)
  beyaz_dis_kenar_refuj_m: 16.0 # outer (right) edge of the southbound main road (within this distance of the median) is white ...
  sari_dis_kenar_y: [1445.0, 1565.0]   # ... except here (yellow, beside the retaining wall)
  # campus roads: RoadRunner has a light concrete gutter strip (~0.5 m) along the curb instead of a painted edge line;
  # gutter running along a tour edge becomes asphalt, its road-side oluk_cizgi_m the edge colour (real: yellow line by the curb)
  oluk_cizgi_m: 0.15

bulut:
  yogunluk: 5.0                 # points per m2 when sampling the AWSIM scene
  karo_m: 50

kamera:                         # ZED left camera of the real vehicle (for "kontrol")
  K: [645.2687, 646.0174, 484.1298, 300.4555]      # fx fy cx cy
  D: [-0.05641, -0.06796, 0.00098, -0.00024]       # k1 k2 p1 p2
  zaman_kaymasi_s: 0.00765
  T_il_euler_xyz: [-0.021590, 0.010479, 1.855427]  # INS <- lidar rotation (rad) and translation (m)
  T_il_t: [-0.006675, -0.006293, 0.154110]
  T_ci: [[-0.003846395003084027, -0.9999767439198289, 0.00563177280926086, 0.06544206321207238],
         [0.01179286511620814, -0.0056767824713887995, -0.9999143475683911, 0.042789840037205935],
         [0.9999230638293274, -0.003779650812894386, 0.011814426008123111, -0.030043351177203036],
         [0, 0, 0, 1]]
  genislik: 960                 # the video is left|right side by side; the left half is used

yol_duzelt:
  # RoadRunner road-surface defects the real road does not have (2026-11-25). In every tour since the first one the AWSIM car
  # jumped ~1 g at these places; the real drive recording (Xsens IMU, ~/harita_gercek/xsens_imu.npy) shows only noise there.
  # Inside each circle the road surface becomes the smoothest surface that joins the unchanged surface around it (bd/yol_duzelt.py).
  cozunurluk_m: 0.25       # grid cell
  sinir_bant_m: 3.0        # band around the circle kept as it is (boundary condition of the fill)
  kenar_sonum_m: 3.0       # off the road the height change fades out over this distance
  bolgeler:
    - {ad: "K3 exit", merkez: [-149.0, 242.6], yaricap_m: 6.0}       # 13 cm ramp over 0.4-0.8 m across both wheel tracks
    - {ad: "return merge", merkez: [-211.3, 207.0], yaricap_m: 10.0}  # 35 cm pit at the west lane edge, 7 cm step under the right wheel track
    - {ad: "K13", merkez: [-205.0, -275.0], yaricap_m: 8.0}          # 10 % grade breaks inside the junction
