# Hüsmart (2026-11-11): Autoware common_sensor_launch/config/ring_outlier_filter_node.param.yaml kopyası,
# tek fark max_rings_num 128 -> 129. AWSIM'in OT128 modeli (RGL HesaiPandar128E4X) halkaları 1..128 numaralar;
# Autoware 0..127 bekler, 128 numaralı halka diziden taşar ve RingOutlierFilter çöker (SIGSEGV).
# Düzeltme laboratuvarın HUSMART-AV/Autoware_1.9.0_launch kitinden alındı. Gerçek (0 tabanlı) Hesai için de zararsız.
/**:
  ros__parameters:
    distance_ratio: 1.03
    object_length_threshold: 0.05
    max_rings_num: 129
    max_points_num_per_ring: 4000
    publish_outlier_pointcloud: false
    min_azimuth_deg: 0.0
    max_azimuth_deg: 360.0
    max_distance: 12.0
    vertical_bins: 128
    horizontal_bins: 36
    noise_threshold: 2
    processing_time_threshold_sec: 0.01
