# Hüsmart: aracın kendi gövdesini kırpan kutu (base_link; m). Yan/köşe JT128'ler gövdeyi çok yakından görüyor;
# Autoware'in araç kutusu (vehicle_info) tam gövde genişliğinde olduğundan gövde noktaları kutunun dışında kalıp
# engel sayılıyordu (AEB). Bu kutu gövdeyi ~0.2 m payla kapsar. common_sensor_launch hattındaki "ayna" kırpma
# kutusunun yerine verilir.
/**:
  ros__parameters:
    min_longitudinal_offset: -1.35
    max_longitudinal_offset: 4.05
    min_lateral_offset: -1.15
    max_lateral_offset: 1.15
    min_height_offset: -0.5
    max_height_offset: 2.3
